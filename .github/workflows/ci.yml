name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + database/WebSocket integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Docker build
        run: docker build -t sentinelbridge:test .
      - name: Start Toxiproxy
        run: |
          docker run -d --name sentinel-toxiproxy --network host ghcr.io/shopify/toxiproxy:2.13.0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8474/proxies > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs sentinel-toxiproxy
          exit 1
      - name: Verify half-open connection recovery with Toxiproxy
        env:
          TOXIPROXY_API_URL: http://127.0.0.1:8474
        run: pnpm test:chaos

